<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Guia Prático de Bloqueios & Sonoanatomia</title>
  <style>
:root {
  --primary-color: #0b1e36;
  --primary-accent: #0284c7;
  --secondary-accent: #0ea5e9;
  --bg-dark: #070f1a;
  --surface-card: #0f243e;
  --surface-card-hover: #163255;
  --border-subtle: #1e3a5f;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-dim: #64748b;
  --warning-bg: #451a03;
  --warning-border: #d97706;
  --warning-text: #fde68a;
  --success-color: #10b981;
  --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-family);
  background-color: var(--bg-dark);
  color: var(--text-main);
  line-height: 1.6;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* Header & Navbar */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background-color: rgba(11, 30, 54, 0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border-subtle);
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.brand-wrapper {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.brand-logo {
  height: 38px;
  width: auto;
  object-fit: contain;
}

.brand-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-main);
  letter-spacing: -0.5px;
}

.brand-subtitle {
  font-size: 0.75rem;
  color: var(--secondary-accent);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.search-container {
  display: flex;
  align-items: center;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  padding: 6px 14px;
  width: 100%;
  max-width: 320px;
}

.search-input {
  background: transparent;
  border: none;
  color: #fff;
  outline: none;
  width: 100%;
  font-size: 0.88rem;
}

.search-input::placeholder {
  color: var(--text-dim);
}

/* Main Container */
.main-wrapper {
  flex: 1;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 20px;
}

/* Category Grid */
.section-heading {
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title {
  font-size: 1.35rem;
  font-weight: 700;
  color: #fff;
}

.category-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
  margin-bottom: 30px;
}

.category-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.25s ease;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.category-card:hover {
  background: var(--surface-card-hover);
  border-color: var(--primary-accent);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(2, 132, 199, 0.15);
}

.category-icon-wrapper {
  width: 48px;
  height: 48px;
  border-radius: 10px;
  background: rgba(2, 132, 199, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 12px;
}

.category-icon {
  width: 28px;
  height: 28px;
  object-fit: contain;
}

.category-title {
  font-size: 1.1rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
}

.category-desc {
  font-size: 0.82rem;
  color: var(--text-muted);
}

/* Block List & Details View */
.block-list-container {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.block-card {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 12px;
  padding: 20px;
  transition: border-color 0.2s;
}

.block-card:hover {
  border-color: var(--secondary-accent);
}

.block-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}

.block-name {
  font-size: 1.25rem;
  font-weight: 700;
  color: #fff;
}

.block-badge {
  background: rgba(14, 165, 233, 0.15);
  color: var(--secondary-accent);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}

.clinical-field {
  margin-bottom: 12px;
}

.field-label {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--secondary-accent);
  letter-spacing: 0.5px;
  margin-bottom: 2px;
}

.field-content {
  font-size: 0.95rem;
  color: var(--text-main);
}

/* Warnings & Pitfalls */
.warning-box {
  background: var(--warning-bg);
  border-left: 4px solid var(--warning-border);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  margin: 16px 0;
}

.warning-title {
  color: var(--warning-text);
  font-weight: 700;
  font-size: 0.85rem;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.warning-list {
  list-style: none;
  padding-left: 0;
}

.warning-list li {
  font-size: 0.88rem;
  color: #fef3c7;
  margin-bottom: 4px;
  position: relative;
  padding-left: 14px;
}

.warning-list li::before {
  content: "•";
  position: absolute;
  left: 0;
  color: var(--warning-border);
}

/* Scientific References Box */
.references-box {
  background: rgba(15, 36, 62, 0.6);
  border-top: 1px solid var(--border-subtle);
  padding-top: 14px;
  margin-top: 14px;
}

.references-title {
  font-size: 0.8rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--text-dim);
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

.reference-item {
  font-size: 0.82rem;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 4px;
}

/* Back navigation button */
.btn-back {
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  color: var(--text-main);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  transition: all 0.2s;
}

.btn-back:hover {
  background: var(--surface-card-hover);
  border-color: var(--primary-accent);
}

/* Banner Image in Details */
.category-banner {
  width: 100%;
  max-height: 220px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 20px;
  border: 1px solid var(--border-subtle);
}

/* Responsive adjust */
@media (max-width: 600px) {
  .app-header {
    flex-direction: column;
    gap: 12px;
    align-items: stretch;
  }
  .search-container {
    max-width: 100%;
  }
  .block-header {
    flex-direction: column;
    gap: 8px;
  }
}

</style>

</head>

  <main class="main-wrapper">

</script>
  <script>
/**
 * Controlador de Navegação e Renderização SPA
 */
const App = {
  currentCategory: null,
  searchQuery: "",

  init() {
    this.bindEvents();
    this.renderHome();
  },

  bindEvents() {
    const searchInput = document.getElementById("search-input");
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        this.searchQuery = e.target.value.toLowerCase().trim();
        if (this.searchQuery.length > 0) {
          this.renderSearchResults(this.searchQuery);
        } else {
          if (this.currentCategory) {
            this.renderCategoryView(this.currentCategory);
          } else {
            this.renderHome();
          }
        }
      });
    }

    const brandBtn = document.getElementById("brand-btn");
    if (brandBtn) {
      brandBtn.addEventListener("click", () => {
        this.currentCategory = null;
        this.searchQuery = "";
        if (searchInput) searchInput.value = "";
        this.renderHome();
      });
    }
  },

  renderHome() {
    this.currentCategory = null;
    const container = document.getElementById("content-container");
    if (!container) return;

    let html = `
      <div class="section-heading">
        <h2 class="section-title">Regiões Anatômicas & Sonoanatomia</h2>
      </div>
      <div class="category-grid">
    `;

    CLINICAL_DATA.categories.forEach((cat) => {
      html += `
        <div class="category-card" onclick="App.selectCategory('${cat.id}')">
          <div class="category-icon-wrapper">
            <img class="category-icon" src="${cat.icon}" alt="${cat.title}" onerror="this.src='assets/img/assets_logo.png'">
          </div>
          <div class="category-title">${cat.title}</div>
          <div class="category-desc">${cat.subtitle}</div>
          <div style="margin-top: 10px; font-size: 0.78rem; color: var(--secondary-accent); font-weight: 600;">
            ${cat.blocks.length} técnicas e procedimentos &rarr;
          </div>
        </div>
      `;
    });

    html += `</div>`;
    container.innerHTML = html;
  },

  selectCategory(categoryId) {
    this.currentCategory = categoryId;
    this.renderCategoryView(categoryId);
  },

  renderCategoryView(categoryId) {
    const category = CLINICAL_DATA.categories.find((c) => c.id === categoryId);
    if (!category) return;

    const container = document.getElementById("content-container");
    if (!container) return;

    let html = `
      <button class="btn-back" onclick="App.renderHome()">
        <span>&larr;</span> Voltar para Regiões
      </button>

      <img class="category-banner" src="${category.banner}" alt="${category.title}" onerror="this.style.display='none'">

      <div class="section-heading">
        <div>
          <h2 class="section-title">${category.title}</h2>
          <p style="color: var(--text-muted); font-size: 0.9rem;">${category.subtitle}</p>
        </div>
      </div>

      <div class="block-list-container">
    `;

    category.blocks.forEach((block) => {
      html += this.buildBlockCard(block);
    });

    html += `</div>`;
    container.innerHTML = html;
  },

  renderSearchResults(query) {
    const container = document.getElementById("content-container");
    if (!container) return;

    const matchedBlocks = [];
    CLINICAL_DATA.categories.forEach((cat) => {
      cat.blocks.forEach((block) => {
        const textToSearch = [
          block.name,
          block.target,
          block.indications,
          block.sonography,
          block.needleApproach,
          block.localAnesthetic
        ]
          .join(" ")
          .toLowerCase();

        if (textToSearch.includes(query)) {
          matchedBlocks.push({ block, categoryTitle: cat.title });
        }
      });
    });

    let html = `
      <button class="btn-back" onclick="App.renderHome()">
        <span>&larr;</span> Voltar para o Início
      </button>
      <div class="section-heading">
        <h2 class="section-title">Resultados da Busca ("${query}")</h2>
        <span style="color: var(--text-muted); font-size: 0.88rem;">${matchedBlocks.length} resultado(s)</span>
      </div>
    `;

    if (matchedBlocks.length === 0) {
      html += `
        <div style="background: var(--surface-card); padding: 40px; text-align: center; border-radius: 12px;">
          <p style="color: var(--text-muted);">Nenhum bloqueio ou estrutura encontrada para o termo pesquisado.</p>
        </div>
      `;
    } else {
      html += `<div class="block-list-container">`;
      matchedBlocks.forEach(({ block, categoryTitle }) => {
        html += this.buildBlockCard(block, categoryTitle);
      });
      html += `</div>`;
    }

    container.innerHTML = html;
  },

  buildBlockCard(block, categoryLabel = null) {
    return `
      <div class="block-card" id="block-${block.id}">
        <div class="block-header">
          <div>
            <div class="block-name">${block.name}</div>
            ${categoryLabel ? `<span style="font-size: 0.78rem; color: var(--text-dim);">${categoryLabel}</span>` : ""}
          </div>
          <span class="block-badge">${block.transducer.split(" ")[0]}</span>
        </div>

        <div class="clinical-field">
          <div class="field-label">Alvo Anatômico</div>
          <div class="field-content">${block.target}</div>
        </div>

        <div class="clinical-field">
          <div class="field-label">Indicações Clínicas</div>
          <div class="field-content">${block.indications}</div>
        </div>

        <div class="clinical-field">
          <div class="field-label">Transdutor & Posicionamento</div>
          <div class="field-content"><strong>Transdutor:</strong> ${block.transducer}<br><strong>Posicionamento:</strong> ${block.position}</div>
        </div>

        <div class="clinical-field">
          <div class="field-label">Sonoanatomia & Marcos de Referência</div>
          <div class="field-content">${block.sonography}</div>
        </div>

        <div class="clinical-field">
          <div class="field-label">Abordagem da Agulha (Needle In-Plane/Out-of-Plane)</div>
          <div class="field-content">${block.needleApproach}</div>
        </div>

        <div class="clinical-field">
          <div class="field-label">Anestésico Local & Volume Recomendado</div>
          <div class="field-content" style="color: #38bdf8; font-weight: 600;">${block.localAnesthetic}</div>
        </div>

        <div class="warning-box">
          <div class="warning-title">
            <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24">
              <path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/>
            </svg>
            Pontos Críticos & Armadilhas (Pitfalls)
          </div>
          <ul class="warning-list">
            ${block.pitfalls.map((p) => `<li>${p}</li>`).join("")}
          </ul>
        </div>

        <div class="references-box">
          <div class="references-title">Evidências Científicas & Diretrizes (ASRA / BJA / RAPM)</div>
          ${block.references.map((r) => `<div class="reference-item">${r}</div>`).join("")}
        </div>
      </div>
    `;
  }
};

window.addEventListener("DOMContentLoaded", () => {
  App.init();
});

</script>
  <script src="js/main.js"></script>
